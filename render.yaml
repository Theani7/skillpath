# Render Blueprint — SkillPath API (free tier)
# Deploy via Render Dashboard → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are prompted at deploy time.
#
# Database: create a Postgres database on Neon (neon.tech) first, then paste
# its POOLED connection string when Render prompts for DATABASE_URL:
#   postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require

services:
  - type: web
    name: skillpath-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r api/requirements.txt && (python -m spacy download en_core_web_sm || echo "spaCy model skipped - regex fallback will be used")
    # 1 gthread worker fits the 512 MB free-tier RAM; threads absorb concurrent
    # requests. DB_POOL_MAX must stay >= threads (see api/database.py note).
    startCommand: gunicorn api.main:app --workers 1 --worker-class gthread --threads 8 --timeout 120 --graceful-timeout 30 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN
        value: "1"
