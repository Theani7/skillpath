name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

jobs:
  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: bun run build

      - name: Security audit
        run: bun audit --high
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Backend — Multi-version testing
  # ──────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check api/ --ignore E501
        continue-on-error: true

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r api/ -ll -ii
        continue-on-error: true

      - name: Check migrations are current
        run: |
          pip install alembic
          alembic check
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python -m pytest api/tests -q --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ──────────────────────────────────────────────
  # Coverage threshold check
  # ──────────────────────────────────────────────
  coverage:
    name: Coverage Threshold
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest-cov

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run tests with coverage threshold
        run: |
          python -m pytest api/tests -q --cov=api --cov-fail-under=70

  # ──────────────────────────────────────────────
  # Auto-release on tag
  # ──────────────────────────────────────────────
  release:
    name: Release
    if: github.event_name == 'release'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release artifacts
        run: |
          mkdir -p dist
          cd frontend && bun install --frozen-lockfile && bun run build && cd ..
          cp -r frontend/dist dist/frontend
          tar -czf skillpath-release.tar.gz dist/

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: skillpath-release.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

